    summary: |
      - First-authored **arXiv:2512.10501** — training-free dual-agent (Actor–Critic) architecture for zero-shot 3D procedural content generation; 80% success, +20% over single-agent baselines.
      - Architected a reproducible Unity benchmarking framework (74 tasks, 6 categories) with an isolated Task Loader to prevent reward hacking; ran head-to-head comparisons of Miao's AI assistants vs. Claude Code (Sonnet 4.5/4.6) over MCP. *(Paper in preparation.)*
      - Built full-stack RAG infrastructure: two-stage retrieval (FAISS + cross-encoder rerank), tree-sitter AST indexing, Merkle-tree incremental sync — deployed as a GPU-accelerated FastAPI service with MongoDB and Docker, exposed as an agent-callable tool.

  - role: Data Science Intern
    org: Public Service Division, Prime Minister's Office (Singapore)
    start: 2023-12-01
    end: 2024-07-31
    summary: |
      - Built an end-to-end pipeline ingesting thousands of unstructured text responses across multiple agencies; cleaned, processed, and vectorised the data for ML/LLM analysis.
      - Fine-tuned a Claude LLM on Amazon SageMaker for sentiment and multi-label feature extraction — automated a manual workflow and saved 20+ analyst-hours/month.
      - Used prompt engineering to turn the LLM into an "explainability engine" producing natural-language rationales; helped agencies cut repeated monthly appeals by 5%.
      - Built interactive Tableau dashboards that surfaced bottlenecks, reducing average resolution time by 14 days.

  - role: Data Project Intern
