bio: |
  I'm an AI/ML Engineer at Miao Worlds working on LLM agents, retrieval-augmented
  generation, and reinforcement learning. I first-authored
  [arXiv:2512.10501](https://arxiv.org/abs/2512.10501) — a training-free dual-agent
  (Actor–Critic) architecture for zero-shot 3D procedural content generation that
  achieves an 80% task success rate, a 20% lift over single-agent baselines.

  I graduated from Nanyang Technological University in 2025 with a BSc (Hons,
  Distinction) in Data Science & AI (CGPA 4.23/5). Before Miao Worlds I worked on
  NLP pipelines at the Prime Minister's Office (Public Service Division) and built
  an AWS data platform at NTUC Health.

  **I'm actively looking for AI/ML Engineer roles — Singapore-based, open to overseas.**

